name: Deploy Techmart to AWS

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: ap-southeast-1
  ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  DOMAIN_NAME: ${{ github.ref == 'refs/heads/main' && 'techmartvn.xyz' || 'staging.techmartvn.xyz' }}
  API_URL: ${{ github.ref == 'refs/heads/main' && 'api.techmartvn.xyz' || 'api-staging.techmartvn.xyz' }}
  ECR_REPOSITORY: techmart-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-backend
  ECS_CLUSTER: techmart-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-cluster
  ECS_SERVICE: techmart-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-service
  FRONTEND_DIR: ./frontend
  BACKEND_DIR: ./backend

jobs:
  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run unit tests with coverage
        run: npm run test:coverage
 
      # Lưu coverage report để xem lại nếu cần debug
      - name: Upload coverage report
        if: always()  # upload dù pass hay fail
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: backend/coverage/
          retention-days: 7

  sonarqube-analysis:
    name: SonarQube Analysis
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code với full lịch sử Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Download coverage report from previous job
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: backend/coverage/
      
      - name: Setup Java on Cloud
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=techmart-mart
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,*.log,test/**,**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy-infrastructure:
    name: Provision Infrastructure
    needs: [sonarqube-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Workspace Select/Create
        working-directory: ./infrastructure
        run: |
          terraform workspace select ${{ env.ENV_NAME }} || terraform workspace new ${{ env.ENV_NAME }}

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_vnp_tmn_code: ${{ secrets.VNP_TMN_CODE }}
          TF_VAR_vnp_hash_secret: ${{ secrets.VNP_HASH_SECRET }}
          TF_VAR_momo_partner_code: ${{ secrets.MOMO_PARTNER_CODE }}
          TF_VAR_momo_access_key: ${{ secrets.MOMO_ACCESS_KEY }}
          TF_VAR_momo_secret_key: ${{ secrets.MOMO_SECRET_KEY }}
          TF_VAR_zalopay_key1: ${{ secrets.ZALOPAY_KEY1 }}
          TF_VAR_zalopay_key2: ${{ secrets.ZALOPAY_KEY2 }}

  deploy-backend:
    name: Build and Deploy Backend
    needs: [deploy-infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment

  deploy-frontend:
    name: Build and Deploy Frontend
    needs: [test-backend, deploy-infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Setup Environment Variables
        working-directory: ${{ env.FRONTEND_DIR }}
        id: setup-env
        run: |
          echo "VITE_API_URL=https://${{ env.API_URL }}" >> $GITHUB_ENV
          echo "VITE_API_URL=https://${{ env.API_URL }}" > .env.production

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Deploy to S3
        working-directory: ${{ env.FRONTEND_DIR }}/dist
        run: |
          aws s3 sync . s3://${{ env.DOMAIN_NAME }} --delete
  
  deploy-logging-agent:
    name: Configure Grafana Promtail Agent
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Production Promtail Config
        run: |
          cat <<EOF > promtail-aws-config.yml
          server:
            http_listen_port: 9080
            grpc_listen_port: 0
          positions:
            filename: /tmp/positions.yaml
          clients:
            - url: http://192.168.56.102:3100/loki/api/v1/push
          scrape_configs:
            - job_name: ecommerce-aws-backend-logs
              static_configs:
                - targets: [localhost]
                  labels:
                    job: ecommerce-v1-backend
                    env: ${{ env.ENV_NAME }}
                    provider: aws-ecs
                    __path__: /var/log/backend_logs/app.log
            - job_name: ecommerce-aws-frontend-logs
              static_configs:
                - targets: [localhost]
                  labels:
                    job: ecommerce-v1-frontend
                    env: ${{ env.ENV_NAME }}
                    provider: aws-s3
                    __path__: /var/log/frontend_logs/access.log
          EOF

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force Refresh ECS Log Agent
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment