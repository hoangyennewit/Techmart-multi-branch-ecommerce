name: Deploy Techmart to AWS

on:
  push:
    branches:
      - main
      - dangnhap

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: techmart-backend
  ECS_CLUSTER: techmart-cluster
  ECS_SERVICE: techmart-service
  FRONTEND_DIR: ./frontend
  BACKEND_DIR: ./backend

jobs:
  test-backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run unit tests with coverage
        run: npm run test:coverage
 
      # Lưu coverage report để xem lại nếu cần debug
      - name: Upload coverage report
        if: always()  # upload dù pass hay fail
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: backend/coverage/
          retention-days: 7
  deploy-infrastructure:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./infrastructure
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_vnp_tmn_code: ${{ secrets.VNP_TMN_CODE }}
          TF_VAR_vnp_hash_secret: ${{ secrets.VNP_HASH_SECRET }}
          TF_VAR_momo_partner_code: ${{ secrets.MOMO_PARTNER_CODE }}
          TF_VAR_momo_access_key: ${{ secrets.MOMO_ACCESS_KEY }}
          TF_VAR_momo_secret_key: ${{ secrets.MOMO_SECRET_KEY }}
          TF_VAR_zalopay_key1: ${{ secrets.ZALOPAY_KEY1 }}
          TF_VAR_zalopay_key2: ${{ secrets.ZALOPAY_KEY2 }}

  deploy-backend:
    name: Build and Deploy Backend
    needs: [test-backend, deploy-infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment

  deploy-frontend:
    name: Build and Deploy Frontend
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Setup Environment Variables
        working-directory: ${{ env.FRONTEND_DIR }}
        id: setup-env
        run: |
          echo "VITE_API_URL=https://api.techmartvn.xyz" >> $GITHUB_ENV
          echo "VITE_API_URL=https://api.techmartvn.xyz" > .env.production

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Deploy to S3
        working-directory: ${{ env.FRONTEND_DIR }}/dist
        run: |
          aws s3 sync . s3://techmartvn.xyz --delete

