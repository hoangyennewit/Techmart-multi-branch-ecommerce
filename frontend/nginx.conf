server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        #điều hướng mọi request về index.html để React xử lí
        try_files $uri/ /index.html;
    }

    #Chặn các lỗi server nếu cần
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}